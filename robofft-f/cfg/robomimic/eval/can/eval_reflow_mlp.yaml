

defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.eval.eval_reflow_agent.EvalReFlowAgent

name: ${env_name}_eval_reflow_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: 
  ${oc.env:ROBOFFT_F_LOG_DIR}/robomimic/eval/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: log/robomimic/pretrain/can/can_pre_reflow_mlp_ta4_td100/2026-03-25_21-00-28_42/checkpoint/state_3000.pt
robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}.json
normalization_path: ${oc.env:ROBOFFT_D_DATA_DIR}/robomimic/${env_name}/normalization.npz


load_ema: true
seed: 42
device: cuda:0
env_name: can
obs_dim: 23
action_dim: 7
denoising_steps: 2
cond_steps: 1
horizon_steps: 4
act_steps: 4
denoising_step_list: [1, 2, 4, 5, 8, 16, 32, 64, 128]

n_steps: 300  # each episode takes max_episode_steps / act_steps steps
render_num: 0
batch_size: 128 # ?

env:
  n_envs: 50
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 300 # 400 # ???
  save_video: False
  wrappers:
    #robomimic_lowdim:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                    'robot0_eef_quat',
                    'robot0_gripper_qpos',
                    'object'] # same order of preprocessed observations
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True
  # render: false

model:
  _target_: model.flow.reflow.ReFlow
  network:
    _target_: model.flow.mlp_flow.FlowMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  device: ${device}
  horizon_steps: ${horizon_steps}
  action_dim: ${action_dim}
  act_min: -1
  act_max: 1
  obs_dim: ${obs_dim}
  max_denoising_steps: ${denoising_steps} 
  # NOTE: RoboFFT-F原本用denoising_step_list测试不同去噪步数，这里
  # 直接用max_denoising_steps也就是denoising_steps
  seed: ${seed}
  sample_t_type: uniform # beta, logitnormal
