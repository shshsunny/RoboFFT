defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.train_fpo_diffusion_agent.TrainFPODiffusionAgent

name: ${env_name}_robofft_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:ROBOFFT_D_LOG_DIR}/robomimic-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:ROBOFFT_D_DATA_DIR}/checkpoints/robofft-d/diffusion/${env_name}/state/state_3000.pt
robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}.json
normalization_path: ${oc.env:ROBOFFT_D_DATA_DIR}/robomimic/${env_name}/normalization.npz

seed: 42
device: cuda:0
env_name: square
obs_dim: 23
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 10
cond_steps: 1
horizon_steps: 4
act_steps: 4


env:
  n_envs: 50
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 400
  save_video: False
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                    'robot0_eef_quat',
                    'robot0_gripper_qpos',
                    'object'] # same order of preprocessed observations
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb:
  entity: ${oc.env:ROBOFFT_D_WANDB_ENTITY}
  project: robomimic-${env_name}-finetune
  run: ${now:%H-%M-%S}_${name}

train:
  n_train_itr: 201
  n_critic_warmup_itr: 5
  n_steps: 400
  gamma: 0.999
  actor_lr: 2e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: ${train.n_train_itr}
    warmup_steps: 0
    min_lr: 2e-5
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: ${train.n_train_itr}
    warmup_steps: 0
    min_lr: 1e-3
  save_model_freq: 100
  val_freq: 10
  render:
    freq: 1
    num: 0
  # PPO specific
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 2500
  update_epochs: 20
  vf_coef: 0.5
  target_kl: 0.05
  # FPO specific
  n_samples_per_action: 16
  eval_style: 'ddpm' # 'ddpm_clip', 'ddpm', 'ddim'
  use_bc_loss: False
  bc_loss_coeff: 0.025
  bc_loss_coeff_end: 0.025
  use_anchor_loss: True
  anchor_loss_coeff: 0.05
  anchor_loss_coeff_end: 0.05
  max_grad_norm: 25.0

model:
  _target_: model.diffusion.diffusion_fpo.FPODiffusion
  gamma_denoising: 1.0
  clip_ploss_style: 'negdisc' # 'ppo' or 'asymmetric' or 'negdisc'
  negdisc_coef: 0.125
  negdisc_coef_end: 0.125
  clip_ploss_coef: 0.005
  switch_aspo_with_raw_advantage: true
  aspo_ploss_coef: 0.005
  clip_ploss_coef_base: 0.005
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.05
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 32
    mlp_dims: [1024, 1024, 1024]
    cond_mlp_dims: [512, 64]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObs
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}

  # FPO specific
  n_samples_per_action: ${train.n_samples_per_action}
  use_per_sample_ratio: false
  logratio_alpha: 1.0
  logprob_normalizer: 0.5
  use_lambda_weight: true
  sample_t_type: 'uniform'
  surrogate_type: 'dsm' # 'cfm' or 'dsm'
  final_action_clip_value: 1
  clip_intermediate_actions: false
  eta_eval: 1.0
  eta_train_min: 1.0
  eta_train_max: 1.0
  bc_loss_type: 'mse'
